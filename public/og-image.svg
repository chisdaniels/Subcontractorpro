<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative hammer icon -->
  <g transform="translate(960 315) rotate(-25)">
    <rect x="-16" y="-140" width="32" height="220" rx="8" fill="url(#gold)" opacity="0.9"/>
    <rect x="-80" y="-155" width="160" height="52" rx="10" fill="url(#gold)" opacity="0.9"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(80 200)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="96" fill="#f59e0b" letter-spacing="4">
      SUBCONTRACTOR
    </text>
    <text x="0" y="100" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="96" fill="#f59e0b" letter-spacing="4">
      PROS
    </text>
  </g>

  <!-- tagline -->
  <text x="80" y="430" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#e2e8f0" font-weight="500">
    Post a job. Get matched with verified pros.
  </text>
  <text x="80" y="480" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#94a3b8">
    Every contractor's license &amp; insurance vetted before they can accept work.
  </text>

  <!-- badges -->
  <g transform="translate(80 540)">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#10b981">✓ VERIFIED PROS</text>

    <rect x="200" y="0" width="200" height="44" rx="22" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f59e0b">FREE TO POST</text>

    <rect x="420" y="0" width="200" height="44" rx="22" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="2"/>
    <text x="520" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#93c5fd">LICENSED &amp; INSURED</text>
  </g>
</svg>
